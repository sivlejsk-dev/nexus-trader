# Render Blueprint — Nexus Trader
# Docs: https://render.com/docs/blueprint-spec
#
# Defines two web services (backend + frontend) and one persistent disk.
# Deploy by connecting this repo in the Render dashboard and selecting
# "Blueprint" — Render reads this file automatically.

services:

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: nexus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend

    # Render Free tier: 512 MB RAM, shared CPU, spins down after inactivity.
    # Upgrade to "starter" ($7/mo) to keep it always-on.
    plan: free

    healthCheckPath: /health

    # SQLite lives on a persistent disk mounted at /data
    disk:
      name: nexus-db
      mountPath: /data
      sizeGB: 1          # 1 GB is plenty for SQLite; increase if needed

    envVars:
      # ── Runtime path ──────────────────────────────────────────────────────
      - key: NEXUS_DB_PATH
        value: /data/nexus_memory.db

      - key: ENVIRONMENT
        value: production

      # CORS: allow the frontend Render URL (set after first deploy)
      # Replace the placeholder with your actual frontend URL.
      - key: CORS_ORIGINS
        value: '["https://nexus-frontend.onrender.com"]'

      # ── AI / LLM ──────────────────────────────────────────────────────────
      # Set these in the Render dashboard under Environment → Secret Files,
      # or paste values directly here (not recommended for secrets).
      - key: NEXUS_API_KEY
        sync: false          # "sync: false" = Render prompts you to fill it in

      - key: NEXUS_API_BASE_URL
        value: https://api.openai.com/v1

      - key: NEXUS_MODEL
        value: gpt-4o

      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      # ── Market data ───────────────────────────────────────────────────────
      - key: POLYGON_API_KEY
        sync: false

      - key: ALPHA_VANTAGE_API_KEY
        sync: false

      - key: TRADIER_API_KEY
        sync: false

      # Switch to live Tradier endpoint in production
      - key: TRADIER_BASE_URL
        value: https://api.tradier.com/v1

      # ── Web research ──────────────────────────────────────────────────────
      - key: SERPER_API_KEY
        sync: false

      - key: BRAVE_API_KEY
        sync: false

      # ── News / sentiment ──────────────────────────────────────────────────
      - key: NEWS_API_KEY
        sync: false

      - key: TWITTER_BEARER_TOKEN
        sync: false

      # ── Auth ──────────────────────────────────────────────────────────────
      - key: JWT_SECRET_KEY
        generateValue: true    # Render generates a random secret on first deploy


  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  - type: web
    name: nexus-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend

    plan: free

    healthCheckPath: /

    buildArgs:
      # Baked into the Next.js build so rewrites point at the live backend.
      # Update this to your actual backend URL after the first deploy.
      - key: BACKEND_API_URL
        value: https://nexus-backend.onrender.com

    envVars:
      - key: BACKEND_API_URL
        value: https://nexus-backend.onrender.com

      - key: NODE_ENV
        value: production

      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
