# Render Blueprint — Nexus Trader
# Docs: https://render.com/docs/blueprint-spec

services:

  # ── Backend (FastAPI) ──────────────────────────────────────────────────────
  - type: web
    name: nexus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    autoDeploy: true
    healthCheckPath: /health

    disk:
      name: nexus-db
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: NEXUS_DB_PATH
        value: /data/nexus_memory.db

      - key: ENVIRONMENT
        value: production

      - key: CORS_ORIGINS
        value: '["https://nexus-frontend.onrender.com"]'

      - key: NEXUS_API_KEY
        sync: false

      - key: NEXUS_API_BASE_URL
        value: https://api.openai.com/v1

      - key: NEXUS_MODEL
        value: gpt-4o

      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile

      - key: POLYGON_API_KEY
        sync: false

      - key: ALPHA_VANTAGE_API_KEY
        sync: false

      - key: TRADIER_API_KEY
        sync: false

      - key: TRADIER_BASE_URL
        value: https://api.tradier.com/v1

      - key: SERPER_API_KEY
        sync: false

      - key: BRAVE_API_KEY
        sync: false

      - key: NEWS_API_KEY
        sync: false

      - key: TWITTER_BEARER_TOKEN
        sync: false

      - key: JWT_SECRET_KEY
        generateValue: true


  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  - type: web
    name: nexus-frontend
    runtime: docker
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    plan: free
    autoDeploy: true
    healthCheckPath: /

    envVars:
      # Next.js rewrites proxy /api/* to FastAPI over Render's private network.
      - key: BACKEND_API_HOSTPORT
        fromService:
          type: web
          name: nexus-backend
          property: hostport

      - key: NODE_ENV
        value: production

      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
